services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build: ./backend
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    ports: ["8000:8000"]
    depends_on: [redis]
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports: ["5173:5173"]
    depends_on: [backend]
